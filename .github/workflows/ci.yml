name: CI
on:
  push:
    branches: [preview, rc, main]
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      public_dependencies:
        type: boolean
        default: false
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.sha }}
permissions:
  contents: read
env:
  GOWORK: 'off'
  PYTHONUTF8: '1'
jobs:
  direction:
    name: ${{ github.event_name == 'pull_request' && format('Branch Flow / {0}', github.base_ref) || 'Branch Direction' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: node scripts/release/branch_flow.cjs
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: python3 scripts/release/release.py validate-policy
      - run: python3 -m unittest discover -s test/release -p 'test_*.py' -v
      - run: node --test scripts/release/branch_flow.test.cjs
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -shellcheck= -pyflakes=
  unit:
    needs: direction
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Check exact source and channel
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          CHANNEL_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          channel=$(python3 -c "import sys,os; sys.path.insert(0,'scripts/release'); from ci_workspace import channel_for; print(channel_for(os.environ['CHANNEL_REF']))")
          python3 scripts/release/release.py check-module --channel "$channel"
      - name: Formatting, vet and module boundary
        shell: bash
        env:
          PUBLIC_DEPENDENCIES: ${{ inputs.public_dependencies }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then test -z "$(gofmt -l .)"; fi
          bash scripts/check-module-boundary.sh
          for module in . e2e examples/worker; do
            go -C "$module" vet ./...
            if [ "$PUBLIC_DEPENDENCIES" = true ]; then
              go -C "$module" mod verify
              go -C "$module" mod tidy
            fi
          done
          git diff --exit-code -- go.mod go.sum e2e/go.mod e2e/go.sum examples/worker/go.mod examples/worker/go.sum
      - name: Unit tests
        run: |
          go test ./... -count=1 -shuffle=on -timeout=2m
          go -C examples/worker test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -shuffle=on -timeout=2m
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Check exact source and channel
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          CHANNEL_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          channel=$(python3 -c "import sys,os; sys.path.insert(0,'scripts/release'); from ci_workspace import channel_for; print(channel_for(os.environ['CHANNEL_REF']))")
          python3 scripts/release/release.py check-module --channel "$channel"
      - name: Start JetStream
        run: |
          docker run -d --name spine-nats -p 127.0.0.1:4222:4222 nats:2.12.1-alpine -js
          mkdir -p "$RUNNER_TEMP/nats-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/nats-tls/server.key" -out "$RUNNER_TEMP/nats-tls/server.crt" 2>/dev/null
          docker run -d --name spine-nats-tls -p 127.0.0.1:4223:4222 \
            -v "$RUNNER_TEMP/nats-tls:/certs:ro" nats:2.12.1-alpine -js \
            --tls --tlscert /certs/server.crt --tlskey /certs/server.key \
            --user spine-test --pass local-only-nats
      - name: Wait for JetStream
        run: |
          for attempt in $(seq 1 30); do
            if docker logs spine-nats 2>&1 | grep -q 'Server is ready' && \
               docker logs spine-nats-tls 2>&1 | grep -q 'Server is ready'; then exit 0; fi
            sleep 1
          done
          docker logs spine-nats
          exit 1
      - name: Broker delivery and application pipeline
        env:
          SPINE_TEST_NATS_URL: nats://127.0.0.1:4222
          SPINE_TEST_NATS_TLS_URL: tls://127.0.0.1:4223
          SPINE_TEST_NATS_TLS_CA: ${{ runner.temp }}/nats-tls/server.crt
          SPINE_TEST_NATS_USER: spine-test
          SPINE_TEST_NATS_PASSWORD: local-only-nats
        run: |
          go test -race -json ./... -count=1 -timeout=2m > live-root.jsonl
          go -C e2e test -race -json ./... -count=1 -timeout=2m > live-application.jsonl
          python3 scripts/check-live-e2e.py live-root.jsonl live-application.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evidence
          path: live-*.jsonl
      - name: Server logs
        if: failure()
        run: |
          docker logs spine-nats
          docker logs spine-nats-tls
  generated-project:
    name: Optional CLI integration
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-cli
          ref: 6cac1948c1a72b3c1bafbd93735040d73bd31454
          path: cli
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Start JetStream
        run: |
          docker run -d --name generated-nats -p 127.0.0.1:4222:4222 nats:2.12.1-alpine -js
          for attempt in $(seq 1 30); do
            if docker logs generated-nats 2>&1 | grep -q 'Server is ready'; then exit 0; fi
            sleep 1
          done
          docker logs generated-nats
          exit 1
      - name: Select exact channel core for Preview CLI tests
        working-directory: platform
        env:
          CHANNEL_REF: ${{ github.base_ref || github.ref_name }}
          PUBLIC_DEPENDENCIES: ${{ inputs.public_dependencies }}
        run: |
          args=()
          if [ "$PUBLIC_DEPENDENCIES" = true ]; then args+=(--public); fi
          python3 scripts/release/generated_core_proxy.py --ref "$CHANNEL_REF" --output "$RUNNER_TEMP/generated-core" "${args[@]}"
      - name: Generate and exercise HTTP and worker applications
        env:
          GOWORK: 'off'
          SPINE_TEST_NATS_URL: nats://127.0.0.1:4222
          SPINE_TEST_NATS_MODULE_DIR: ${{ github.workspace }}/platform
        run: |
          go -C cli test -race -json ./internal/cli -run '^TestGenerated(NATSAssembly|DynamicPlatform)E2E$' -count=1 -timeout=10m > generated-project.jsonl
          python3 platform/scripts/check-generated-e2e.py generated-project.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-project-evidence
          path: generated-project.jsonl
  verified:
    name: ${{ github.event_name == 'pull_request' && format('Verified Source / {0}', github.base_ref) || 'Verified Source' }}
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [direction, policy, unit, live]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          if any(job['result'] != 'success' for job in json.loads(os.environ['RESULTS']).values()):
              raise SystemExit('필수 검사가 모두 성공해야 합니다')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + os.environ['SOURCE_SHA'] + '\n')
          PY
